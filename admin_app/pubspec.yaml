name: admin_app
description: KSA Biz admin mobile app with offline support.
publish_to: 'none'
version: 3.1.1+7

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../packages/core
  l10n:
    path: ../packages/l10n
  maps_ui:
    path: ../packages/maps_ui
  media:
    path: ../packages/media
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  record: ^6.0.0
  geolocator: ^13.0.4
  table_calendar: ^3.1.3

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
